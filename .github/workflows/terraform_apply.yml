name: Terraform Apply

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TF_VAR_osc_access_key_id: ${{ secrets.OSC_ACCESS_KEY_ID }}
      TF_VAR_osc_secret_key_id: ${{ secrets.OSC_SECRET_KEY_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.OSC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.OSC_SECRET_KEY_ID }}
      OUTSCALE_ACCESSKEYID: ${{ secrets.OSC_ACCESS_KEY_ID }}
      OUTSCALE_SECRETKEYID: ${{ secrets.OSC_SECRET_KEY_ID }}
      AWS_EC2_METADATA_DISABLED: true
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install SOPS
        env:
          SOPS_VERSION: v3.12.1
        run: |
          curl -sLO https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64
          curl -sLO https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.checksums.txt
          sha256sum --check --ignore-missing sops-${SOPS_VERSION}.checksums.txt
          chmod +x sops-${SOPS_VERSION}.linux.amd64
          sudo mv sops-${SOPS_VERSION}.linux.amd64 /usr/local/bin/sops
          sops --version

      - name: Decrypt Secrets for Terraform
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          for f in config/*.enc.yaml; do
            sops -d "$f" > "${f%.enc.yaml}.yaml"
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: v1.15.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_domain: ${{ secrets.GWS_DOMAIN }}
          TF_VAR_customer_id: ${{ secrets.GWS_CUSTOMER_ID }}
          TF_VAR_target_service_account: ${{ secrets.GWS_TARGET_SERVICE_ACCOUNT }}
          TF_VAR_default_user_password: ${{ secrets.GWS_DEFAULT_USER_PASSWORD }}
          TF_VAR_enable_user_creation: true

      - name: Remove decrypted files
        run: |
          for f in config/*.enc.yaml; do
            rm -f "${f%.enc.yaml}.yaml"
          done
